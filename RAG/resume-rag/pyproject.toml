[project]
name = "resume-rag"
version = "0.1.0"
description = "A local RAG application for asking questions across resumes"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "cloudinary>=1.44,<2",
    "fastapi[standard]>=0.116,<1",
    "httpx>=0.28,<1",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
