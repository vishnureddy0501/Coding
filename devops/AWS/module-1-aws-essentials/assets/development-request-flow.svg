<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1350" viewBox="0 0 1900 1350" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end development request flow for FastAPI on AWS</title>
  <desc id="desc">A numbered development request diagram from a developer through the internet gateway and security group to Nginx and FastAPI on a development EC2 instance, including MongoDB Atlas, S3, Parameter Store, and Session Manager.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/></marker>
    <marker id="returnArrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#059669"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/></filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Arial,sans-serif;fill:#475569}
      .h{font:700 20px Arial,sans-serif;fill:#0f172a}.t{font:400 15px Arial,sans-serif;fill:#334155}
      .b{font:700 15px Arial,sans-serif;fill:#1e293b}.n{font:700 17px Arial,sans-serif;fill:#fff}
      .flow{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
      .return{fill:none;stroke:#059669;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#returnArrow)}
      .manage{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:2;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1900" height="1350" fill="#f8fafc"/>
  <text x="950" y="48" text-anchor="middle" class="title">End-to-End Development Request</text>
  <text x="950" y="78" text-anchor="middle" class="sub">No load balancer yet • Access is restricted to your public IP</text>

  <rect x="35" y="105" width="1010" height="1195" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="140" class="h">Request path</text>

  <!-- Developer -->
  <g filter="url(#shadow)"><rect x="330" y="155" width="400" height="90" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="530" y="190" text-anchor="middle" class="h">Developer / Browser</text><text x="530" y="218" text-anchor="middle" class="t">Calls dev public IP or api-dev.example.com</text></g>
  <circle cx="280" cy="268" r="22" fill="#2563eb"/><text x="280" y="274" text-anchor="middle" class="n">1</text>
  <path d="M530 247 L530 300" class="flow"/>

  <!-- Internet path -->
  <g filter="url(#shadow)"><rect x="330" y="302" width="400" height="86" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="530" y="335" text-anchor="middle" class="h">Internet Gateway + Public Route</text><text x="530" y="363" text-anchor="middle" class="t">0.0.0.0/0 → Internet Gateway</text></g>
  <circle cx="280" cy="410" r="22" fill="#2563eb"/><text x="280" y="416" text-anchor="middle" class="n">2</text>
  <path d="M530 390 L530 440" class="flow"/>

  <!-- VPC -->
  <rect x="115" y="435" width="830" height="630" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="140" y="472" class="h">AWS VPC — Public development subnet</text>

  <!-- Dev SG -->
  <g filter="url(#shadow)"><rect x="300" y="505" width="460" height="90" rx="16" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="530" y="538" text-anchor="middle" class="h">Development EC2 Security Group</text><text x="530" y="565" text-anchor="middle" class="t">Allows port 80 only from YOUR_PUBLIC_IP/32</text></g>
  <circle cx="260" cy="615" r="22" fill="#2563eb"/><text x="260" y="621" text-anchor="middle" class="n">3</text>
  <path d="M530 596 L530 640" class="flow"/>

  <!-- EC2 -->
  <g filter="url(#shadow)"><rect x="240" y="642" width="580" height="175" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/><text x="530" y="678" text-anchor="middle" class="h">Development EC2</text><rect x="285" y="704" width="190" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="380" y="734" text-anchor="middle" class="h">Nginx</text><text x="380" y="758" text-anchor="middle" class="t">listens on port 80</text><rect x="585" y="704" width="190" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="680" y="734" text-anchor="middle" class="h">FastAPI</text><text x="680" y="758" text-anchor="middle" class="t">localhost port 8000</text><path d="M477 740 L580 740" class="flow"/></g>
  <circle cx="195" cy="730" r="22" fill="#2563eb"/><text x="195" y="736" text-anchor="middle" class="n">4</text>

  <!-- Role/config -->
  <g filter="url(#shadow)"><rect x="200" y="865" width="660" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="530" y="899" text-anchor="middle" class="h">EC2 IAM Role + Dev Configuration</text><text x="530" y="926" text-anchor="middle" class="t">Reads /fastapi/dev/* and receives temporary AWS credentials</text></g>
  <circle cx="155" cy="910" r="22" fill="#2563eb"/><text x="155" y="916" text-anchor="middle" class="n">5</text>
  <path d="M680 819 C680 845 650 850 650 862" class="flow"/>

  <!-- Dependencies -->
  <path d="M530 958 C530 995 300 985 300 1022" class="flow"/>
  <path d="M530 958 C530 995 530 985 530 1022" class="flow"/>
  <path d="M530 958 C530 995 760 985 760 1022" class="flow"/>
  <g filter="url(#shadow)"><rect x="185" y="1025" width="230" height="90" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="300" y="1059" text-anchor="middle" class="h">Atlas Dev DB</text><text x="300" y="1086" text-anchor="middle" class="t">Application records</text></g>
  <g filter="url(#shadow)"><rect x="430" y="1025" width="200" height="90" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="530" y="1059" text-anchor="middle" class="h">Dev S3</text><text x="530" y="1086" text-anchor="middle" class="t">Private files</text></g>
  <g filter="url(#shadow)"><rect x="645" y="1025" width="230" height="90" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="760" y="1059" text-anchor="middle" class="h">Parameter Store</text><text x="760" y="1086" text-anchor="middle" class="t">Dev settings/secrets</text></g>
  <circle cx="140" cy="1070" r="22" fill="#2563eb"/><text x="140" y="1076" text-anchor="middle" class="n">6</text>

  <!-- Response -->
  <path d="M180 1120 C60 1120 60 205 325 205" class="return"/>
  <circle cx="72" cy="755" r="22" fill="#059669"/><text x="72" y="761" text-anchor="middle" class="n">7</text>
  <text x="90" y="784" class="b">Response returns</text>

  <!-- Session Manager -->
  <g filter="url(#shadow)"><rect x="255" y="1185" width="550" height="75" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="530" y="1217" text-anchor="middle" class="h">Separate management path: Session Manager</text><text x="530" y="1242" text-anchor="middle" class="t">Used for terminal access; not part of normal API requests</text></g>
  <path d="M530 1160 L530 1182" class="manage"/>

  <!-- Explanations -->
  <rect x="1080" y="105" width="785" height="1195" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1110" y="145" class="h">What each numbered step does</text>
  <g transform="translate(1110,190)"><circle cx="22" cy="22" r="21" fill="#2563eb"/><text x="22" y="28" text-anchor="middle" class="n">1</text><text x="58" y="17" class="h">Developer sends an HTTP request</text><text x="58" y="44" class="t">The source is your current public IP address.</text></g>
  <g transform="translate(1110,315)"><circle cx="22" cy="22" r="21" fill="#2563eb"/><text x="22" y="28" text-anchor="middle" class="n">2</text><text x="58" y="17" class="h">Public network path reaches the VPC</text><text x="58" y="44" class="t">The subnet default route uses the Internet Gateway.</text></g>
  <g transform="translate(1110,440)"><circle cx="22" cy="22" r="21" fill="#2563eb"/><text x="22" y="28" text-anchor="middle" class="n">3</text><text x="58" y="17" class="h">Security group checks your IP</text><text x="58" y="44" class="t">Port 80 works only when the source matches YOUR_PUBLIC_IP/32.</text></g>
  <g transform="translate(1110,565)"><circle cx="22" cy="22" r="21" fill="#2563eb"/><text x="22" y="28" text-anchor="middle" class="n">4</text><text x="58" y="17" class="h">Nginx forwards to FastAPI</text><text x="58" y="44" class="t">Nginx receives port 80 and proxies to local container port 8000.</text></g>
  <g transform="translate(1110,690)"><circle cx="22" cy="22" r="21" fill="#2563eb"/><text x="22" y="28" text-anchor="middle" class="n">5</text><text x="58" y="17" class="h">FastAPI gets dev configuration</text><text x="58" y="44" class="t">The EC2 role permits only dev parameters and dev AWS resources.</text></g>
  <g transform="translate(1110,815)"><circle cx="22" cy="22" r="21" fill="#2563eb"/><text x="22" y="28" text-anchor="middle" class="n">6</text><text x="58" y="17" class="h">FastAPI performs dependency calls</text><text x="58" y="44" class="t">It uses the Atlas dev DB, dev S3 bucket, and dev settings.</text></g>
  <g transform="translate(1110,940)"><circle cx="22" cy="22" r="21" fill="#059669"/><text x="22" y="28" text-anchor="middle" class="n">7</text><text x="58" y="17" class="h">Response returns directly</text><text x="58" y="44" class="t">FastAPI → Nginx → Internet Gateway → your browser.</text></g>

  <rect x="1110" y="1075" width="715" height="160" rx="15" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="1135" y="1110" class="h">How development differs from production</text>
  <text x="1135" y="1145" class="t">• No ALB, target group, or ACM certificate initially.</text>
  <text x="1135" y="1176" class="t">• Your IP is allowed directly to dev EC2 port 80.</text>
  <text x="1135" y="1207" class="t">• Only dev database, bucket, parameters, and IAM permissions are used.</text>
</svg>
