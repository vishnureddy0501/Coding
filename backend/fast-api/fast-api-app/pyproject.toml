[project]
name = "fastapi-practice"
version = "0.1.0"
description = "A minimal FastAPI practice API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
