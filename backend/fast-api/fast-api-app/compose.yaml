services:
  api:
    image: ${APP_IMAGE:-fastapi-app:local}
    build:
      context: .
    env_file:
      - ${APP_ENV_FILE:-.env}
    ports:
      # Only Nginx on the EC2 host should expose this application publicly.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
